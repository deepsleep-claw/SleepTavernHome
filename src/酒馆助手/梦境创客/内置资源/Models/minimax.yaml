revision: "2026-08-10"
interfaceType: openai-chat
compatibilityMode: standard
models:
  - id: minimax:minimax-m2
    name: MiniMax M2 系列
    provider: minimax
    aliases: [minimax-m2, minimax-m2.1, minimax-m2.5, minimax-m2.7]
    patterns: ["minimax-m2*", "*/minimax-m2*"]
    sourceUrl: https://platform.minimax.io/docs/guides/models-intro
    confidence: medium
    settings:
      contextWindow: 204800
      maxOutputTokens: 131072
      capabilities: { vision: auto, reasoning: enabled, toolCalling: enabled, webSearch: auto }
  - id: minimax:minimax-m3
    name: MiniMax M3
    provider: minimax
    aliases: [minimax-m3]
    patterns: ["minimax-m3*", "*/minimax-m3*"]
    sourceUrl: https://www.minimax.io/models/text/m3
    confidence: medium
    settings:
      contextWindow: 1000000
      maxOutputTokens: 128000
      capabilities: { vision: enabled, reasoning: enabled, toolCalling: enabled, webSearch: disabled }
