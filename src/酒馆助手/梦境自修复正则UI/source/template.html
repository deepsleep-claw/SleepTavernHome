<div class="dream-self-repair-ui" data-dream-self-repair-ui>
  <textarea class="dream-self-repair-ui__source" aria-hidden="true" hidden>$1</textarea>
  <details class="dream-self-repair-ui__panel">
    <summary class="dream-self-repair-ui__summary">
      <span class="dream-self-repair-ui__check" aria-hidden="true">✓</span>
      <span class="dream-self-repair-ui__mark" aria-hidden="true"></span>
      <strong class="dream-self-repair-ui__headline">梦魇已除，今夜正好……</strong>
      <span class="dream-self-repair-ui__chevron" aria-hidden="true"></span>
    </summary>

    <div class="dream-self-repair-ui__content">
      <section class="dream-self-repair-ui__review">
        <div class="dream-self-repair-ui__review-heading">
          <span class="dream-self-repair-ui__review-mark" aria-hidden="true"></span>
          <span class="dream-self-repair-ui__document-icon" aria-hidden="true"></span>
          <strong>自检摘要</strong>
        </div>
        <p class="dream-self-repair-ui__review-text"></p>
      </section>

      <section class="dream-self-repair-ui__changes">
        <div class="dream-self-repair-ui__patch-list"></div>
      </section>

      <footer class="dream-self-repair-ui__footer">
        <div class="dream-self-repair-ui__result" role="status">
          <span class="dream-self-repair-ui__result-check" aria-hidden="true">✓</span>
          <span class="dream-self-repair-ui__result-text">正在读取修复记录…</span>
        </div>
        <div class="dream-self-repair-ui__actions">
          <button class="dream-self-repair-ui__button dream-self-repair-ui__button--repatch" type="button">
            <span class="dream-self-repair-ui__button-icon" aria-hidden="true">↻</span>
            <span>重新 Patch</span>
          </button>
          <button class="dream-self-repair-ui__button dream-self-repair-ui__button--reverse" type="button">
            <span class="dream-self-repair-ui__button-icon" aria-hidden="true">↶</span>
            <span>反 Patch</span>
          </button>
        </div>
      </footer>
    </div>
  </details>
</div>
