<div class="dream-paraller-event-ui" data-dream-paraller-event-ui>
  <template class="dream-paraller-event-ui__source">$1</template>
  <details class="dream-paraller-event-ui__panel">
    <summary class="dream-paraller-event-ui__summary">
      <span class="dream-paraller-event-ui__system" aria-hidden="true">
        <span class="dream-paraller-event-ui__system-core"></span>
        <span class="dream-paraller-event-ui__planet-orbit dream-paraller-event-ui__planet-orbit--one"><i></i></span>
        <span class="dream-paraller-event-ui__planet-orbit dream-paraller-event-ui__planet-orbit--two"><i></i></span>
        <span class="dream-paraller-event-ui__planet-orbit dream-paraller-event-ui__planet-orbit--three"><i></i></span>
      </span>
      <span class="dream-paraller-event-ui__heading">
        <strong class="dream-paraller-event-ui__title">平行事件</strong>
        <small class="dream-paraller-event-ui__subtitle">故事之外，这些仍然在发生……</small>
      </span>
      <span class="dream-paraller-event-ui__meta" aria-live="polite"></span>
      <span class="dream-paraller-event-ui__chevron" aria-hidden="true"></span>
    </summary>
    <div class="dream-paraller-event-ui__ambient" aria-hidden="true">
      <span class="dream-paraller-event-ui__nebula dream-paraller-event-ui__nebula--violet"></span>
      <span class="dream-paraller-event-ui__nebula dream-paraller-event-ui__nebula--cyan"></span>
      <span class="dream-paraller-event-ui__stars"></span>
      <span class="dream-paraller-event-ui__meteor dream-paraller-event-ui__meteor--one"></span>
      <span class="dream-paraller-event-ui__meteor dream-paraller-event-ui__meteor--two"></span>
    </div>
    <div class="dream-paraller-event-ui__content">
      <div class="dream-paraller-event-ui__events"></div>
      <p class="dream-paraller-event-ui__empty" hidden>暂无可展示的平行事件</p>
    </div>
  </details>
</div>
